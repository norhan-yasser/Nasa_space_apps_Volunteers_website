<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Self-test</title>
<style>body{font:15px system-ui;max-width:760px;margin:30px auto;padding:0 16px}.p{color:#0a7d33}.f{color:#c00;font-weight:700}li{margin:3px 0}</style></head>
<body><h1>Routing &amp; sign-in self-test</h1>
<p>Runs in <b>demo mode</b> (your real database is never touched). Serve the project folder, e.g. <code>python -m http.server</code>, then open <code>/tests/selftest.html</code>.</p>
<h3 id="sum">Running…</h3><ul id="out"></ul>
<script>window.TECHOPS_FIREBASE = {};</script>
<script src="../scripts/services/config.js"></script>
<script>window.TECHOPS_FIREBASE = {};</script>
<script src="../scripts/services/seed-data.js"></script>
<script src="../scripts/services/data.js"></script>
<script src="../scripts/services/common.js"></script>
<script src="../scripts/services/store.js"></script>
<script src="selftest.js"></script>
<script>
runSelfTest().then(function (res) {
  var bad = res.filter(function (r) { return !r.pass; }).length;
  document.getElementById("sum").innerHTML = bad ? '<span class="f">' + bad + ' FAILED</span>' : '<span class="p">All ' + res.length + ' checks passed</span>';
  document.getElementById("out").innerHTML = res.map(function (r) { return '<li class="' + (r.pass ? "p" : "f") + '">' + (r.pass ? "PASS" : "FAIL") + " — " + r.name + (r.extra ? " (" + r.extra + ")" : "") + "</li>"; }).join("");
  window.TechOpsStore.resetDemo && window.TechOpsStore.resetDemo();
});
</script></body></html>
