<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Logistics Dashboard · NASA Space Apps Challenge Cairo</title>
  <meta name="description" content="Logistics team dashboard: requests from members (go to a place, prayer, help) that volunteers claim and complete.">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../techops/css/techops.css">
  <link rel="stylesheet" href="css/logistics.css">
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('techops_theme') || 'dark'); } catch (e) {}</script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="app">
    <header class="top">
      <a class="brand" href="index.html" aria-label="Logistics dashboard home">
        <img class="logo-dark" src="../assets/logos/NSAC_HORIZONTAL_WHITE.png" alt="NASA Space Apps Challenge">
        <img class="logo-light" src="../assets/logos/NSAC_HORIZONTAL_DARK.png" alt="NASA Space Apps Challenge">
        <span class="brand-text">
          <span class="brand-title">LOGISTICS</span>
          <span class="brand-sub">OPERATIONS · CAIRO</span>
        </span>
      </a>
      <div class="sp"></div>
      <span class="pill-status demo" id="status-pill"><i></i><span id="status-text">Connecting…</span></span>
      <button class="btn" id="theme-toggle" aria-label="Toggle light or dark theme"><span class="btn-text">Light</span></button>
      <button class="icon-btn bell" id="bell" aria-label="Show unclaimed requests" hidden>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="count" id="bell-count" hidden>0</span>
      </button>
    </header>

    <!-- CODE PAGE: Logistics volunteers sign in with their volunteer code -->
    <section class="login-screen" id="login-screen" hidden>
      <div class="login-card">
        <div class="login-logo">
          <img class="logo-dark" src="../assets/logos/NSAC_HORIZONTAL_WHITE.png" alt="NASA Space Apps Challenge">
          <img class="logo-light" src="../assets/logos/NSAC_HORIZONTAL_DARK.png" alt="NASA Space Apps Challenge">
        </div>
        <div class="form-header-badge">Logistics team · Cairo</div>
        <h1>Logistics sign in</h1>
        <form id="login-form" autocomplete="off" novalidate>
          <label class="lbl" for="login-code">Volunteer Code</label>
          <input id="login-code" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="e.g. LG-001" aria-describedby="login-error">
          <p class="login-error" id="login-error" role="alert" hidden></p>
          <button class="btn primary login-btn" id="login-btn" type="submit">Sign in</button>
        </form>
        <p class="login-note" id="login-note" hidden></p>
        <p style="margin-top:14px"><a href="../index.html" class="muted" style="font-size:13px">&larr; Back to Overview</a></p>
      </div>
    </section>

    <main id="main" hidden>
      <div class="note" id="demo-note" hidden></div>

      <div class="log-toolbar">
        <a class="btn" href="../index.html">Overview</a>
        <a class="btn" href="../maps.html">Maps</a>
        <a class="btn" href="../request/poster.html">Participant QR poster</a>
        <a class="btn" href="../request/form.html" target="_blank" rel="noopener">Participant form</a>
        <button class="btn" id="alerts-btn" title="Sound and desktop notifications for new requests">Enable alerts</button>
        <span class="sp"></span>
        <div class="user-chip" id="user-chip">
          <span class="user-avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="user-meta"><b id="user-name"></b><small id="user-team"></small></span>
          <button class="btn small" id="logout-btn" aria-label="Sign out">Sign out</button>
        </div>
      </div>

      <section id="tab-issues">
        <div class="page-title">
          <h2>Requests</h2>
          <span class="greeting" id="greeting"></span>
        </div>
        <div class="row issues-filter-row" style="margin-bottom:14px">
          <div id="issue-filters" class="chips-scroll-row"></div>
          <span class="sp desktop-only"></span>
          <input id="issue-search" type="search" placeholder="Search room, request or name…" aria-label="Search requests">
        </div>
        <div class="table-wrap">
          <table class="issues-table">
            <thead>
              <tr><th>Status</th><th>Reported</th><th>Location</th><th>Request</th><th>Details</th><th>Assigned to</th><th>Action</th></tr>
            </thead>
            <tbody id="issue-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="../techops/js/config.js"></script>
  <script src="../techops/js/firebase-config.js"></script>
  <script src="../techops/js/seed-data.js"></script>
  <script src="../techops/js/data.js"></script>
  <script src="../techops/js/common.js"></script>
  <script src="../techops/js/store.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
